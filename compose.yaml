services:
  backend:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cms
      SPRING_DATASOURCE_USERNAME: cms_user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/prescriptions
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLINIC_ADMIN_USERNAME: ${CLINIC_ADMIN_USERNAME:-}
      CLINIC_ADMIN_PASSWORD: ${CLINIC_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms_user -d cms"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres-data:
  mongo-data:
